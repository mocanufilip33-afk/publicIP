<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Il tuo IP</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      background: #111;
      color: white;
    }
    h1 {
      color: #00ff88;
    }
    #ip {
      font-size: 40px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>🌍 Il tuo indirizzo IP pubblico è:</h1>
  <div id="ip">Caricamento...</div>

  <script>
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => {
        document.getElementById("ip").innerText = data.ip;
      })
      .catch(() => {
        document.getElementById("ip").innerText = "Errore nel caricamento";
      });
  </script>

</body>
</html>
